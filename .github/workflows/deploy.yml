name: Deploy to GCP VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: Upload jar to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: build/libs/footprint-0.0.1-SNAPSHOT.jar
          target: /opt/footprint/
          strip_components: 2

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            OLD_PID=$(systemctl show -p MainPID --value footprint)
            mv /opt/footprint/footprint-0.0.1-SNAPSHOT.jar /opt/footprint/app.jar
            sudo -n systemctl restart footprint
            NEW_PID=$(systemctl show -p MainPID --value footprint)
            echo "PID: $OLD_PID -> $NEW_PID"
            if [ "$NEW_PID" = "$OLD_PID" ] || [ "$NEW_PID" = "0" ]; then
              echo "service was not restarted"; sudo -n journalctl -u footprint -n 60 --no-pager; exit 1
            fi
            for i in $(seq 1 40); do
              if sudo -n journalctl -u footprint _PID=$NEW_PID --no-pager | grep -q "Started FootprintApplication"; then
                echo "deploy OK (new process $NEW_PID)"; exit 0
              fi
              if ! systemctl is-active --quiet footprint; then break; fi
              sleep 3
            done
            echo "new server did not start"; sudo -n journalctl -u footprint -n 80 --no-pager; exit 1
